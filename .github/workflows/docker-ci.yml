name: CI - Node Docker

# Se ejecuta cada vez que haces push a la rama main
on:
  push:
    branches:
      - main

jobs:
  build:
    # La acción corre en una máquina virtual con Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona tu repositorio
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Instala Node.js
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Instala todas las dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Ejecuta tus tests
      - name: Run tests
        run: npm test

      # 5️⃣ Construye tu imagen Docker
      - name: Build Docker image
        run: docker build -t coder-api .
